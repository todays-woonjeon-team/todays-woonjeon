# 판정 기준값. 비워 두면 공통 모듈(RuleConfig)의 기본값을 쓴다.
# 에뮬레이터 테스트를 하면서 이 파일만 고쳐 조정한다. 근거는 docs/scoring-rules.md

# 급가속·급출발·급감속 (1초 동안 속도 변화, km/h)
harsh.accel.kmhPerSec=6
harsh.accel.minSpeedKmh=6
harsh.start.kmhPerSec=8
harsh.start.maxSpeedKmh=5
harsh.decel.kmhPerSec=9
harsh.releaseRatio=0.7

# 급회전: 25km/h 넘는 속도에서 4초 안에 진행 방향이 60도 이상 바뀜
harsh.turn.minSpeedKmh=25
harsh.turn.headingDeg=60
harsh.turn.windowMillis=4000

# 핸들 각도로 진행 방향을 추정할 때 쓰는 차량 값(차종에 맞게 조정)
vehicle.steeringRatio=14
vehicle.wheelbaseMeters=2.7

# 교차로 회전 판정
turn.steerStartDeg=20
turn.steerEndDeg=10
turn.minPeakSteerDeg=90
turn.minHeadingDeg=45
turn.minSpeedKmh=8
turn.maxSpeedKmh=40
signal.graceMillis=2000
signal.earlyMillis=3000
signal.blinkMergeMillis=1200

# 차로 변경(깜빡이를 켠 경우만 미리 켜기 집계)
lane.minSpeedKmh=30
lane.minSteerDeg=5
lane.minSignalMillis=1000

# 빗길·휴식
rain.minMeters=5000
rest.longDriveMinutes=90
rest.deadlineMinutes=120
rest.minRestMinutes=15

# 점수 계산 최소 거리, 단거리 기준
score.minMeters=3000
score.shortTripMeters=10000
