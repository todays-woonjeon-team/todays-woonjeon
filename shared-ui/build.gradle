plugins {
    id 'com.android.library'
}

android {
    namespace 'com.todaysdrive.ui'
    compileSdk rootProject.ext.compileSdk

    defaultConfig {
        minSdk 26
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    api project(':core')
}
